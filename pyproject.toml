[project]
name = "overreact"
version = "1.2.0"
description = "⚛️📈 Create and analyze chemical microkinetic models built from computational chemistry data"
authors = [
    { name = "Felipe S. S. Schneider", email = "schneider.felipe@posgrad.ufsc.br" },
    { name = "Giovanni F. Caramori", email = "giovanni.caramori@ufsc.br" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "catalysis",
    "chemical-kinetics",
    "chemical-reactions",
    "chemistry",
    "compchem",
    "computational-chemistry",
    "density-functional-theory",
    "gaussian",
    "hartree-fock",
    "microkinetics",
    "orca",
    "quantum-tunneling",
    "reactions",
    "temperature",
    "thermochemistry",
    "thermodynamics",
    "vibrational-entropies",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cclib>=1,<2",
    "scipy>=1.10,<2",
    "importlib>=1.0.4,<2",
]

[project.optional-dependencies]
cli = ["rich>=13,<16"]
fast = [
    "jax>=0.4",
    "jaxlib>=0.4",
]
solvents = ["thermo>=0.2"]

[project.urls]
Homepage = "https://geem-lab.github.io/overreact-guide/"
Repository = "https://github.com/geem-lab/overreact"
Documentation = "https://geem-lab.github.io/overreact-guide/"
"API documentation" = "https://geem-lab.github.io/overreact/"
PyPI = "https://pypi.org/project/overreact/"
"Bug Tracker" = "https://github.com/geem-lab/overreact/issues"
Discussions = "https://github.com/geem-lab/overreact/discussions"
Citation = "https://doi.org/10.1002/jcc.26861"

[project.scripts]
overreact = "overreact._cli:main"

[dependency-groups]
dev = [
    "debugpy>=1,<2",
    "flynt>=0.77,<1.1",
    "ipython>=8,<10",
    "jupyter>=1.0.0,<2",
    "matplotlib>=3,<4",
    "mypy>=0.991,<2.4",
    "pdoc>=12,<17",
    "perflint>=0.7.1,<0.9.0",
    "pytest>=7.2,<10.0",
    "pytest-cov>=4,<8",
    "rich>=13,<16",
    "thermo>=0.2",
    "ruff>=0.0.210,<0.16.6",
    "seaborn>=0.12,<0.14",
    "types-setuptools>=65,<85",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
# TODO(mrauen): make this list shorter
ignore = [
  "A002",
  "A003",
  "A005",
  "ANN001", # MissingTypeFunctionArgument
  "ANN002",
  "ANN003",
  "ANN201", # MissingReturnTypePublicFunction
  "ANN202", # MissingReturnTypePrivateFunction
  "ANN204",
  "B008",
  "B023",
  "B026",
  "B904",
  "C901",
  "COM812",
  "E501",
  "FBT001",
  "FBT002",
  "FBT003",
  "FIX002",
  "G004",
  "N803",
  "N806",
  "NPY002",
  "PLC0206", # Extracting value from dictionary without calling .items()
  "PLC0208",
  "PLC0415", # Allow importing inside of functions
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW2901",
  "PTH112",
  "PTH113",
  "PTH118",
  "PTH120",
  "PTH122",
  "PTH123",
  "RET505",
  "RET507",
  "RUF001",
  "S101",   # AssertUsed
  "SLF001",
  "T201",
  "TD003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.coverage.run]
include = ["overreact/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
sort = "Miss"

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-glob=\"*.rst\""
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS NUMBER"
norecursedirs = ["_build", "examples"]
