# Runs the shared lint/type/test checks (checks.yml) on every push to main
# and every pull request.

name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

# Cancel any run still going for a previous commit on the same branch/PR once
# a new one is pushed, instead of letting superseded runs burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
