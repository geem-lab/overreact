# Runs the shared lint/type/test checks (checks.yml) on every push to main
# and every pull request.
#
# Deliberately no paths-ignore here (e.g. excluding **.md): checks / lint and
# checks / test (3.14) are required status checks on main's branch
# protection, and a required check that a doc-only PR's commits never
# trigger leaves that PR permanently stuck on "Expected -- waiting for
# status" -- paths-ignore and required-status-checks don't mix.

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run without a throwaway commit -- e.g. after a GitHub Actions
  # incident drops the webhook for a push/pull_request event and no run
  # ever gets created for that commit. Trigger from the Actions tab or
  # `gh workflow run build.yml --ref <branch>`.
  workflow_dispatch:

# Cancel any run still going for a previous commit on the same branch/PR once
# a new one is pushed, instead of letting superseded runs burn CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    secrets: inherit
