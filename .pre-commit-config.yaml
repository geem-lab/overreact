# See CONTRIBUTING.md for installation instructions.
#
# Hooks below shell out to `uv run` instead of pinning their own `rev:`, so
# they always use the exact tool versions locked in uv.lock (the same ones
# CI runs in .github/workflows/checks.yml) with nothing extra to keep in
# sync.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy (overreact/, tests/)
        entry: uv run mypy overreact tests
        language: system
        files: ^(overreact|tests)/.*\.py$
        pass_filenames: false
